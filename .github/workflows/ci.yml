name: ci
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

env:
  # L1 needs the v1.0.4 passes (read_blif, write_blif --gates-as-names, abc --gates, dfflibmap
  # and unmap). The released v1.1.0 wheel has them (the old pin 80e89ff is 5 commits before the
  # v1.1.0 tag; tools/equiv-check and tests/micro are identical), so the test job installs the
  # wheel instead of building Odin III from source on every run. The v1.1.0 source checkout
  # (no build) supplies tools/equiv-check and tests/micro through ODIN3_ROOT.
  ODIN3_TAG: v1.1.0
  ODIN3_WHEEL: https://github.com/drpaj12/odin3/releases/download/v1.1.0/odin3-1.1.0-py3-none-linux_x86_64.whl
  # ABC_COMMIT is third_party/abc at the odin3 80e89ff pin (equiv-check needs an ABC binary).
  ABC_COMMIT: a3001b72edc5de22442e942165487fddf150e3d0

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Drafts skip CI. A PR touching only docs/** and *.md reports code=false, so build/test jobs skip
    # (a skipped job satisfies a required check); the docs job still runs.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.f.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ]; then
            if git diff --name-only "$BASE...$HEAD" | grep -qvE '^(docs/|.*\.md$)'; then code=true; else code=false; fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # PRs: 3.12 only; push to main: both.
        python: ${{ fromJSON(github.event_name == 'pull_request' && '["3.12"]' || '["3.11","3.12"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ruff mypy cffi "wyrd @ git+https://github.com/drpaj12/wyrd@11ee708790f05a4830ffa9172ea56e509115c33b"
      # mypy sees the optional analysis and GNN libraries; torch comes from the CPU wheel index.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      # These library pins duplicate pyproject.toml's [project.optional-dependencies]; keep the two
      # files in step when either changes.
      - run: pip install "numpy>=1.26" "scipy>=1.11" "scikit-learn>=1.5" "networkx>=3.3" "torch_geometric>=2.5"
      - run: ruff check .
      - run: mypy --strict loki tests

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # PRs: 3.12 only; push to main: both.
        python: ${{ fromJSON(github.event_name == 'pull_request' && '["3.12"]' || '["3.11","3.12"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/checkout@v4
        with:
          repository: drpaj12/odin3
          ref: ${{ env.ODIN3_TAG }}
          path: odin3-src  # source only, not built: tools/equiv-check and tests/micro
      # equiv-check needs the ABC binary; build the submodule commit once and cache it.
      - uses: actions/cache@v4
        id: abc-cache
        with:
          path: abc-bin
          key: abc-${{ env.ABC_COMMIT }}
      - if: steps.abc-cache.outputs.cache-hit != 'true'
        run: |
          git clone --filter=blob:none https://github.com/berkeley-abc/abc abc-src
          git -C abc-src checkout "$ABC_COMMIT"
          make -C abc-src -j4 ABC_USE_NO_READLINE=1 abc
          mkdir -p abc-bin && cp abc-src/abc abc-bin/abc
      - run: pip install cffi "$ODIN3_WHEEL" "wyrd @ git+https://github.com/drpaj12/wyrd@11ee708790f05a4830ffa9172ea56e509115c33b"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      # odin3 comes from the release wheel, not a dist on an index, so the project is
      # installed without dependencies and the [dev] extra's libraries are named here instead.
      - run: pip install --no-deps ".[dev]"
      # These library pins duplicate pyproject.toml's [project.optional-dependencies]; keep the two
      # files in step when either changes.
      - run: pip install "numpy>=1.26" "scipy>=1.11" "scikit-learn>=1.5" "networkx>=3.3" "torch_geometric>=2.5"
      # The real-ORCA test pins the default graphlet backend against the actual binary; the
      # fetch verifies the pinned sha256 and builds it (~2 s), so the test runs instead of skipping.
      - run: loki tools fetch-orca
      - name: Locate the wheel's bundled libodin3.so (slang adapter lookup uses ODIN3_LIB's directory)
        run: echo "ODIN3_LIB=$(python -c 'import odin3, pathlib; print(pathlib.Path(odin3.__file__).parent / "libodin3.so")')" >> "$GITHUB_ENV"
      - run: python -m unittest discover -s tests -t . -v
        env:
          ODIN3_ROOT: ${{ github.workspace }}/odin3-src
          ODIN3_ABC: ${{ github.workspace }}/abc-bin/abc

  docs:
    needs: changes
    if: needs.changes.result == 'success'
    # The user manual (docs/user, Sphinx + MyST). Warnings are errors. Deployed by pages.yml on push
    # to main.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - run: sphinx-build -W -b html docs/user build/docs
