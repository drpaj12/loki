name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  # L1 needs the v1.0.4 passes (read_blif, write_blif --gates-as-names, abc --gates, dfflibmap
  # and unmap), so the test jobs build Odin III from source at this commit instead of installing
  # the v1.0.0 wheel. ABC_COMMIT is third_party/abc at that commit (cmake/abc_pin.cmake checks it).
  ODIN3_COMMIT: 80e89ff631e95d719284dac8785752b2a689c6f7
  ABC_COMMIT: a3001b72edc5de22442e942165487fddf150e3d0  # odin3 80e89ff third_party/abc

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ruff mypy cffi "wyrd @ git+https://github.com/drpaj12/wyrd@11ee708790f05a4830ffa9172ea56e509115c33b"
      # mypy sees the optional analysis and GNN libraries; torch comes from the CPU wheel index.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      # These library pins duplicate pyproject.toml's [project.optional-dependencies]; keep the two
      # files in step when either changes.
      - run: pip install "numpy>=1.26" "scipy>=1.11" "scikit-learn>=1.5" "networkx>=3.3" "torch_geometric>=2.5"
      - run: ruff check .
      - run: mypy --strict loki tests

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/checkout@v4
        with:
          repository: drpaj12/odin3
          ref: ${{ env.ODIN3_COMMIT }}
          path: odin3-src
          submodules: recursive  # third_party/abc at the pin; cmake/abc_pin.cmake checks it
      - name: Build Odin III (release, with the linked ABC adapter)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build bison flex
          cmake --preset release
          cmake --build --preset release --target odin3
        working-directory: odin3-src
      # equiv-check needs the ABC binary; build the submodule commit once and cache it.
      - uses: actions/cache@v4
        id: abc-cache
        with:
          path: abc-bin
          key: abc-${{ env.ABC_COMMIT }}
      - if: steps.abc-cache.outputs.cache-hit != 'true'
        run: |
          git clone --filter=blob:none https://github.com/berkeley-abc/abc abc-src
          git -C abc-src checkout "$ABC_COMMIT"
          make -C abc-src -j4 ABC_USE_NO_READLINE=1 abc
          mkdir -p abc-bin && cp abc-src/abc abc-bin/abc
      - run: pip install cffi "wyrd @ git+https://github.com/drpaj12/wyrd@11ee708790f05a4830ffa9172ea56e509115c33b"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      # odin3 is the source checkout on PYTHONPATH, not a dist on an index, so the project is
      # installed without dependencies and the [dev] extra's libraries are named here instead.
      - run: pip install --no-deps ".[dev]"
      # These library pins duplicate pyproject.toml's [project.optional-dependencies]; keep the two
      # files in step when either changes.
      - run: pip install "numpy>=1.26" "scipy>=1.11" "scikit-learn>=1.5" "networkx>=3.3" "torch_geometric>=2.5"
      # The real-ORCA test pins the default graphlet backend against the actual binary; the
      # fetch verifies the pinned sha256 and builds it (~2 s), so the test runs instead of skipping.
      - run: loki tools fetch-orca
      - run: python -m unittest discover -s tests -t . -v
        env:
          ODIN3_ROOT: ${{ github.workspace }}/odin3-src
          ODIN3_LIB: ${{ github.workspace }}/odin3-src/build/release/libodin3.so
          ODIN3_ABC: ${{ github.workspace }}/abc-bin/abc
          PYTHONPATH: ${{ github.workspace }}/odin3-src/plugins/python

  docs:
    # The user manual (docs/user, Sphinx + MyST). Warnings are errors. Deployed by pages.yml on push
    # to main.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - run: sphinx-build -W -b html docs/user build/docs
