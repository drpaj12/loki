name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  ODIN3_WHEEL: https://github.com/drpaj12/odin3/releases/download/v1.0.0/odin3-1.0.0-py3-none-linux_x86_64.whl
  ABC_COMMIT: a3001b72edc5de22442e942165487fddf150e3d0  # odin3 v1.0.0 third_party/abc

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ruff mypy cffi "wyrd @ git+https://github.com/drpaj12/wyrd@11ee708790f05a4830ffa9172ea56e509115c33b"
      - run: ruff check .
      - run: mypy --strict loki tests

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/checkout@v4
        with:
          repository: drpaj12/odin3
          ref: v1.0.0
          path: odin3-src
      # equiv-check needs the ABC binary; build the submodule commit once and cache it.
      - uses: actions/cache@v4
        id: abc-cache
        with:
          path: abc-bin
          key: abc-${{ env.ABC_COMMIT }}
      - if: steps.abc-cache.outputs.cache-hit != 'true'
        run: |
          git clone --filter=blob:none https://github.com/berkeley-abc/abc abc-src
          git -C abc-src checkout "$ABC_COMMIT"
          make -C abc-src -j4 ABC_USE_NO_READLINE=1 abc
          mkdir -p abc-bin && cp abc-src/abc abc-bin/abc
      - run: pip install cffi "$ODIN3_WHEEL" "wyrd @ git+https://github.com/drpaj12/wyrd@11ee708790f05a4830ffa9172ea56e509115c33b"
      - run: pip install .
      - run: python -m unittest discover -s tests -t . -v
        env:
          ODIN3_ROOT: ${{ github.workspace }}/odin3-src
          ODIN3_ABC: ${{ github.workspace }}/abc-bin/abc
