[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loki"
version = "0.1.0"
description = "Loki III: reverse engineering of structural netlists (part of Yggdrasil III)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["odin3"]

# The extras' library pins below are duplicated by hand in .github/workflows/ci.yml (the lint and
# test jobs' pip install lines, because odin3 is not on an index there); keep the two in step.
[project.optional-dependencies]
analysis = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.5", "networkx>=3.3"]
gnn = ["loki[analysis]", "torch>=2.3", "torch_geometric>=2.5"]
dev = ["loki[analysis]", "loki[gnn]"]

[project.scripts]
loki = "loki.cli:main"

[project.entry-points."wyrd.steps"]
loki-dataset = "loki.step:DatasetStep"
loki-re = "loki.re_step:ReStep"

[tool.setuptools.packages.find]
include = ["loki*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"

[[tool.mypy.overrides]]
# Wyrd ships no py.typed marker; analyse its source instead of treating it as Any.
module = ["wyrd", "wyrd.*"]
follow_untyped_imports = true
